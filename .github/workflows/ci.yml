# Checks every package builds from a clean clone. No test suites yet: this
# catches type errors, lint, a stale API contract and a broken deploy image.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: apkh-api (lint, types, build, API contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apkh-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apkh-api/package-lock.json
      - run: npm ci
      - run: npx eslint "src/**/*.ts"
      - run: npx tsc --noEmit
      - run: npm run build
      # openapi.json is committed; it must match the code.
      - run: npm run openapi
      - name: API contract is up to date
        run: |
          git diff --exit-code -- openapi.json || {
            echo "::error::apkh-api/openapi.json is stale. Run 'npm run build && npm run openapi' in apkh-api and commit it."
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apkh-api/openapi.json

  web:
    name: apkh-web (lint, types, build)
    needs: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apkh-web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apkh-web/package-lock.json
      - run: npm ci
      # Types generated from the API's contract must match the committed ones.
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: apkh-api
      - run: npm run api:types
      - name: Generated API types are up to date
        run: |
          git diff --exit-code -- src/services/api-schema.d.ts || {
            echo "::error::apkh-web/src/services/api-schema.d.ts is stale. Run 'npm run api:types' in apkh-web and commit it."
            exit 1
          }
      - run: npx eslint
      - run: npx tsc --noEmit
      - run: npm run build

  search:
    name: apkh-search (install, compile, import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apkh-search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apkh-search/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py routes services
      # Importing the app loads every route and service module.
      - name: App imports
        env:
          JWT_SECRET: ci-only
          BUILTIN_AI: "off"
        run: python -c "import main; print(len(main.app.routes), 'routes')"

  storage-mcp:
    name: apkh-storage and apkh-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: apkh-storage
        working-directory: apkh-storage
        run: npm ci && node --check server.js
      - name: apkh-mcp
        working-directory: apkh-mcp
        run: npm ci && npm run build

  deploy-image:
    name: Hugging Face Space image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same folder deploy/hf-space/push.sh uploads: the three backends plus
      # the Space files at the top.
      - name: Stage the Space
        run: |
          mkdir -p "$RUNNER_TEMP/space"
          git archive HEAD apkh-api apkh-search apkh-storage | tar -x -C "$RUNNER_TEMP/space"
          cp deploy/hf-space/Dockerfile deploy/hf-space/start.sh deploy/hf-space/README.md "$RUNNER_TEMP/space/"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/space
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
